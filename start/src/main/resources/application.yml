server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8

spring:
  # db
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ahuralearn?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 058524
#    todo 视频上传的时候需注意 可能调整
  servlet:
    multipart:
      max-request-size: 200MB
      file-size-threshold: 200MB

# mp log output
logging:
  level:
    com.ahuralearn.common.mapper: debug

# swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs #v3 means OpenAPI 3 specification
knife4j:
  enable: true
  setting:
    language: en
#    language: zh_cn
ahuralearn:
  oss:
    default-avatar: user/avatar/defaultAvatar.jpg
    endpoint: oss-ap-southeast-3.aliyuncs.com
    bucket-name: ahuralearn
    access-key-id: # change to your own AccessKeyID
    access-key-secret: # change to your own AccessKeySecret
    url-prefix: https://ahuralearn.oss-ap-southeast-3.aliyuncs.com/
